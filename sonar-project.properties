sonar.projectKey=comfy-studio
sonar.projectName=Comfy Studio
sonar.sources=.
sonar.tests=tests

# never analyze these, even if they end up checked out
sonar.exclusions=**/node_modules/**,**/dist/**,**/.venv/**,__pycache__/**,**/__pycache__/**,**/*.pyc,tests/**

# Python backend (webui/server, pipeline, video, runpod)
sonar.python.version=3.14
# CI writes this with pytest. The UI has no tests, so coverage is measured on the Python side only.
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=webui/ui/**

# Test style: pytest's assertion rewriting makes composite assertions *more* readable
# (one message showing every operand), so S9073 (split composite assertions) is scoped off there.
sonar.issue.ignore.multicriteria=t1
sonar.issue.ignore.multicriteria.t1.ruleKey=python:S9073
sonar.issue.ignore.multicriteria.t1.resourceKey=tests/**
